<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Ashby-like Apply (Offline Fixture)</title>
</head>
<body>
  <h1>Ashby-like Fixture</h1>
  <form id="ashby-like-form" data-adapter="ashby_like" action="thank_you.html" method="get">
    <label>Name <input type="text" name="name" id="name" required /></label>
    <label>Email <input type="email" name="email" id="email" required /></label>
    <label>Phone <input type="tel" name="phone" id="phone" /></label>
    <label>Additional <textarea name="additionalInfo" id="additionalInfo"></textarea></label>
    <label>Resume <input type="file" name="resume" id="resume" accept=".pdf" /></label>
    <button type="submit" id="submit-application">Submit application</button>
  </form>
</body>
</html>
