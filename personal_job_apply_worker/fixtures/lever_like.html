<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Lever-like Apply (Offline Fixture)</title>
</head>
<body>
  <h1>Lever-like Fixture</h1>
  <form id="lever-like-form" data-adapter="lever_like" action="thank_you.html" method="get">
    <label>Full name <input type="text" name="name" id="name" required /></label>
    <label>Email <input type="email" name="email" id="email" required /></label>
    <label>Phone <input type="tel" name="phone" id="phone" /></label>
    <label>Comments <textarea name="comments" id="comments"></textarea></label>
    <label>Resume <input type="file" name="resume" id="resume" accept=".pdf" /></label>
    <button type="submit" id="submit-application">Submit application</button>
  </form>
</body>
</html>
