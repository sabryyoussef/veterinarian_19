<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Workable-like Apply (Offline Fixture)</title>
</head>
<body>
  <h1>Workable-like Fixture</h1>
  <form id="workable-like-form" data-adapter="workable_like" action="thank_you.html" method="get">
    <label>First name <input type="text" name="firstname" id="firstname" required /></label>
    <label>Last name <input type="text" name="lastname" id="lastname" required /></label>
    <label>Email <input type="email" name="email" id="email" required /></label>
    <label>Phone <input type="tel" name="phone" id="phone" /></label>
    <label>Cover <textarea name="cover_letter" id="cover_letter"></textarea></label>
    <label>Resume <input type="file" name="resume" id="resume" accept=".pdf" /></label>
    <button type="submit" id="submit-application">Submit application</button>
  </form>
</body>
</html>
